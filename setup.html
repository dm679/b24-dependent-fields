<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Установка полей сделки</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="//api.bitrix24.com/api/v1/"></script>
  <style>
    .setup { max-width: 560px; margin: 0 auto; }
    .setup__btn {
      appearance: none; border: 0; cursor: pointer;
      background: var(--df-accent); color: #fff; font-weight: 600;
      font-size: 14px; padding: 12px 18px; border-radius: 10px;
    }
    .setup__btn:disabled { opacity: .5; cursor: default; }
    .setup__log {
      margin-top: 16px; font-size: 13px; line-height: 1.6;
      background: #0f1729; color: #cbd5e1; border-radius: 10px;
      padding: 14px 16px; white-space: pre-wrap; min-height: 60px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="df-form setup">
    <h2 class="df-title">Создание пользовательских полей сделки</h2>
    <p style="font-size:13px;color:#6b7280;margin-top:0;">
      Создаст недостающие поля из <code>schema.js</code>. Уже существующие
      не трогает. Нужны права администратора и scope <code>crm</code>.
    </p>
    <button class="setup__btn" id="run">Создать поля</button>
    <div class="setup__log" id="log">Готов к запуску…</div>
  </div>

  <script src="schema.js"></script>
  <script src="setup-fields.js"></script>
  <script>
    (function () {
      const logEl = document.getElementById('log');
      const btn = document.getElementById('run');
      function log(line) { logEl.textContent += '\n' + line; }

      function start() {
        btn.disabled = true;
        logEl.textContent = 'Старт…';
        ensureDealFields(window.FORM_SCHEMA, log, (result) => {
          log('—');
          log('Создано: ' + result.created.length +
              ', уже было: ' + result.existed.length +
              ', ошибок: ' + result.errors.length);
          if (result.errors.length === 0) log('Готово ✓ Можно открывать карточку сделки.');
          btn.disabled = false;
          if (typeof BX24 !== 'undefined') BX24.fitWindow();
        });
      }

      if (typeof BX24 !== 'undefined') {
        BX24.init(() => { btn.addEventListener('click', start); });
      } else {
        logEl.textContent = 'Открой эту страницу как приложение Битрикс24 — ' +
          'без SDK создать поля нельзя.';
        btn.disabled = true;
      }
    })();
  </script>
</body>
</html>
